name: CI

# Default pull-request gate for this repository. `main` is the public default
# branch. Inherited workflows in this directory also run the broader suite
# (sharded tests, Postgres E2E, secret scanning) on `main` and `master`.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.13
      - name: Install
        run: bun install --frozen-lockfile
      - name: Verify
        run: bun run verify

  # One bun process per runner. `bun run test` fans out several
  # processes on a single machine and was OOM-killed locally (about 5 GB
  # resident per process on a 16 GB VM). This matches the existing Test
  # workflow: each shard is its own job.
  test:
    name: Unit shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.13
      - name: Install
        run: bun install --frozen-lockfile
      - name: Run shard ${{ matrix.shard }} of 4
        run: bash scripts/test-shard.sh ${{ matrix.shard }} 4
